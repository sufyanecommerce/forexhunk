  h1{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);margin-bottom:14px;}

  .note{position:relative;font-family:var(--mono);font-size:12px;color:var(--muted);background:rgba(198,255,77,0.06);border:1px solid rgba(198,255,77,0.18);border-radius:10px;padding:14px 16px;margin:22px 0;text-align:left;line-height:1.6;}
  .btn{position:relative;display:inline-block;margin-top:8px;background:var(--lime);color:#08080B;padding:14px 28px;border-radius:8px;font-family:var(--display);font-weight:800;font-size:14px;}
